name: deliver

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deliver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build package
        run: python scripts/package.py

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist
          if-no-files-found: error

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 7
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

      - name: Release check
        run: python scripts/release_check.py release staging

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://room-card4321.example.com
    timeout-minutes: 7
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

      - name: Release check
        run: python scripts/release_check.py release production
