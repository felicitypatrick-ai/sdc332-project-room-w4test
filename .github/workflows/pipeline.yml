name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Write test results to run summary
        if: always()
        shell: bash
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          cat test-results.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build release package
        run: python scripts/package.py
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: room-build-card4321
          path: dist/
          retention-days: 7

